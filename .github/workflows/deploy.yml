name: Check and deploy website

env:
  CONTAINER_NAME: cute-boi
  APP_PORT: "3015"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check HTML assets and JavaScript
        run: |
          python3 scripts/check-site.py
          node --check /tmp/cute-boi-inline.js
      - name: Check deployment script
        run: |
          bash -n scripts/deploy.sh
          bash -n scripts/deploy-container.sh

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build and deploy Docker container over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PRIVATE_KEY: ${{ secrets.VPS_PRIVATE_KEY }}
          VPS_USER: ${{ secrets.VPS_USER || 'deploy' }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH || '/var/www/cute-boi' }}
        run: bash scripts/deploy.sh
